name: CI — lint, typecheck, test, audit, build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Dependency audit
        run: npm audit --audit-level=moderate

      - name: Secret scan
        run: bash ./scripts/secret-scan.sh

      - name: Production build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
