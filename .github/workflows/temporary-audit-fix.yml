name: Temporary audit repair\n\non:\n  workflow_dispatch:\n\npermissions:\n  contents: write\n\njobs:\n  repair:\n    runs-on: ubuntu-latest\n    defaults:\n      run:\n        working-directory: cybersecurity-portfolio\n    steps:\n      - uses: actions/checkout@v4\n        with:\n          ref: feature/vyra-editorial\n          token: ${{ secrets.GITHUB_TOKEN }}\n      - uses: actions/setup-node@v4\n        with:\n          node-version: 22.12.0\n          cache: npm\n          cache-dependency-path: cybersecurity-portfolio/package-lock.json\n      - run: npm ci\n      - run: npm audit fix\n      - name: Commit scoped lockfile repair and remove temporary workflow\n        run: |\n          git config user.name 'github-actions[bot]'\n          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'\n          git rm ../.github/workflows/temporary-audit-fix.yml\n          git add package-lock.json package.json\n          git diff --cached --quiet && exit 0\n          git commit -m 'chore(deps): apply npm audit fix'\n          git push origin HEAD:feature/vyra-editorial\n