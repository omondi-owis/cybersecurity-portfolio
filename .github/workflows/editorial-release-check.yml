name: Editorial release check

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cybersecurity-portfolio
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: cybersecurity-portfolio/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Lint
        run: npm run lint

      - name: Dependency audit
        run: npm run audit

      - name: Secret scan
        run: npm run secret-scan

      - name: Production build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'

      - name: Mobile browser smoke check
        env:
          CI: 'true'
        run: |
          npm exec --yes --package=playwright@1.57.0 -- playwright install --with-deps chromium
          npm run start > /tmp/vyra-next.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid' EXIT
          for attempt in {1..30}; do curl -fsS http://127.0.0.1:3000/ > /dev/null && break; sleep 1; done
          cat > /tmp/editorial-mobile-smoke.mjs <<'EOF'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({ headless: true });
          for (const width of [360, 390, 430]) {
            const page = await browser.newPage({ viewport: { width, height: 900 } });
            await page.goto('http://127.0.0.1:3000/', { waitUntil: 'networkidle' });
            const toggle = page.getByRole('button');
            await toggle.last().click();
            await page.getByRole('link', { name: 'Services' }).click();
            if (!page.url().endsWith('/services')) throw new Error(`services navigation failed at ${width}px`);
            await page.goBack({ waitUntil: 'networkidle' });
            await toggle.last().click();
            await page.keyboard.press('Escape');
            await page.close();
          }
          await browser.close();
          EOF
          npm exec --yes --package=playwright@1.57.0 -- node /tmp/editorial-mobile-smoke.mjs
