name: Scoped dependency repair
on:
  push:
    branches: [feature/vyra-editorial]
    paths: [.github/workflows/audit-repair.yml]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/vyra-editorial
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Regenerate scoped lockfile
        working-directory: cybersecurity-portfolio
        run: npm install --package-lock-only && npm ci && npm run audit
      - name: Commit scoped dependency repair
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add cybersecurity-portfolio/package.json cybersecurity-portfolio/package-lock.json
          if ! git diff --cached --quiet; then git commit -m "fix: lock patched minimatch dependency"; git push origin HEAD:feature/vyra-editorial; fi
